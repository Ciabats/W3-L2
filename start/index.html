<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<title>Task Manager</title>
	<link rel="stylesheet" href=".qodo\assets\style\style.css" />
	<script src=".qodo\assets\script\script.js" defer></script>
</head>

<body>
	<h1 id="titolo">I miei task</h1>

	<div class="aggiunta">
		<form id="task-form">
			<label for="nuovo-task">Aggiungere task</label>
			<input id="nuovo-task" type="text" placeholder="Cosa devi fare?" required />
			<label for="priorita"></label>
			<select id="priorita-task" required>
				<option value="A">alta</option>
				<option value="M">media</option>
				<option value="B">bassa</option>
			</select>
				<button id="bottone-aggiungi" type="button">Aggiungi</button>
		</form>
	</div>

	<ul id="lista-task">

	</ul>

	<p>Totale: <span id="contatore">0</span></p>


</body>

</html>
